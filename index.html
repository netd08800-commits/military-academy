<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Военная Академия</title>
    <style>
        :root {
            --bg: #1a2a1f;
            --panel: #2d3e2b;
            --gold: #c5a54a;
            --light: #e0e0d0;
            --accent: #4a6b3a;
            --danger: #8b3a3a;
            --text: #ccc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 20% 30%, #344e2c 5%, #1a2a1f 80%);
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            padding: 30px;
            margin: 20px;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2em;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .emblem {
            display: inline-block;
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
        .star {
            color: var(--gold);
            font-size: 3em;
            display: inline-block;
        }
        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-tab {
            background: #3a4e36;
            border: none;
            color: var(--light);
            padding: 10px 20px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .nav-tab.active, .nav-tab:hover {
            background: var(--accent);
            color: white;
        }
        .tab-content {
            background: #2a3524;
            border-radius: 0 8px 8px 8px;
            padding: 20px;
            min-height: 250px;
            animation: fadeIn 0.4s;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--gold);
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #1e281a;
            border: 1px solid #5a6a4a;
            border-radius: 5px;
            color: white;
            font-size: 1em;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1em;
        }
        button:hover { background: #5a824a; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #b04a4a; }
        .alert {
            background: #3a3a1e;
            border-left: 5px solid var(--gold);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        a { color: var(--gold); text-decoration: underline; }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #1f2d1a;
            padding: 10px;
            border-radius: 6px;
        }
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .card {
            background: #25301e;
            border: 1px solid #4a5a3a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        th, td {
            border: 1px solid #4a5a3a;
            padding: 8px;
            text-align: left;
        }
        th { background: #3a4e36; color: var(--gold); }
        .close { float: right; cursor: pointer; color: var(--gold); }
        .message { background: #1e3a1e; padding: 10px; border-radius: 5px; margin: 5px 0; }
        .error-box {
            background: #3a1e1e;
            color: #ffaaaa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ff5555;
        }
    </style>
</head>
<body>
    <div class="container" id="app">Загрузка...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (async function() {
            const SUPABASE_URL = 'https://ykyrlqsurncrpqvxtpyr.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_R8rYXsnveFho0Y3FNp1jEQ_mFTDl92A';
            let supabase;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                // Проверим соединение
                const { error: pingError } = await supabase.from('users').select('id').limit(1);
                if (pingError) throw new Error('Ошибка подключения к базе: ' + pingError.message + '. Возможно, не созданы таблицы в Supabase.');
            } catch (e) {
                document.getElementById('app').innerHTML = `<div class="error-box"><strong>Ошибка запуска:</strong><br>${e.message}<br><br>Убедись, что ты выполнила SQL-запросы из инструкции в Supabase (SQL Editor).</div>`;
                console.error(e);
                return;
            }

            // ---------- ХЭШ ПАРОЛЯ ----------
            async function sha256(message) {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // ---------- СОСТОЯНИЕ ----------
            let currentUser = null;
            let activeTab = 'main';

            // ---------- ИНИЦИАЛИЗАЦИЯ ----------
            async function initApp() {
                const savedId = localStorage.getItem('userId');
                if (savedId) {
                    const { data, error } = await supabase
                        .from('users')
                        .select('id, username, role')
                        .eq('id', savedId)
                        .single();
                    if (data && !error) {
                        currentUser = data;
                    } else {
                        localStorage.removeItem('userId');
                        localStorage.removeItem('username');
                    }
                }
                render();
            }

            // ---------- ВЫХОД ----------
            function logout() {
                localStorage.removeItem('userId');
                localStorage.removeItem('username');
                currentUser = null;
                activeTab = 'main';
                render();
            }

            // ---------- РЕГИСТРАЦИЯ ----------
            async function register(username, password) {
                const hash = await sha256(password);
                const { data, error } = await supabase
                    .from('users')
                    .insert([{ username, password_hash: hash, role: 'user' }])
                    .select('id, username, role')
                    .single();
                if (error) {
                    alert('Ошибка регистрации: ' + error.message);
                    return;
                }
                currentUser = data;
                localStorage.setItem('userId', data.id);
                localStorage.setItem('username', data.username);
                render();
            }

            // ---------- ВХОД ----------
            async function login(username, password) {
                const hash = await sha256(password);
                const { data, error } = await supabase
                    .from('users')
                    .select('id, username, role')
                    .eq('username', username)
                    .eq('password_hash', hash)
                    .single();
                if (error || !data) {
                    alert('Неверный логин или пароль');
                    return;
                }
                currentUser = data;
                localStorage.setItem('userId', data.id);
                localStorage.setItem('username', data.username);
                activeTab = 'main';
                render();
            }

            // ---------- СМЕНА РОЛИ (модер) ----------
            async function changeRole(userId, newRole) {
                const { error } = await supabase
                    .from('users')
                    .update({ role: newRole })
                    .eq('id', userId);
                if (error) alert('Ошибка: ' + error.message);
                else render();
            }

            // ---------- УПРАВЛЕНИЕ ФОРМАМИ (модер) ----------
            async function loadForms() {
                const { data, error } = await supabase.from('forms').select('*').order('id');
                return data || [];
            }

            async function createForm(category, title, description, fields) {
                await supabase.from('forms').insert([{ category, title, description, fields }]);
                render();
            }

            async function deleteForm(formId) {
                await supabase.from('forms').delete().eq('id', formId);
                render();
            }

            async function toggleFormStatus(formId, currentStatus) {
                await supabase.from('forms').update({ is_active: !currentStatus }).eq('id', formId);
                render();
            }

            // ---------- ОТПРАВКА ФОРМЫ (курсант) ----------
            async function submitForm(formId, formDataObj) {
                const { error } = await supabase
                    .from('form_submissions')
                    .insert([{ form_id: formId, user_id: currentUser.id, data: formDataObj }]);
                if (error) alert('Ошибка отправки: ' + error.message);
                else alert('Запрос отправлен!');
            }

            // ---------- РЕНДЕР ИНТЕРФЕЙСА ----------
            async function render() {
                const app = document.getElementById('app');
                if (!currentUser) {
                    app.innerHTML = `
                        <div class="header">
                            <div class="emblem"><span class="star">★</span></div>
                            <h1>Военная Академия</h1>
                            <p style="color: #aaa;">Доступ только для авторизованных</p>
                        </div>
                        <div class="flex-row" style="gap: 30px;">
                            <div style="flex:1;">
                                <h3 style="color:var(--gold);">Вход</h3>
                                <div class="form-group"><input id="loginUser" placeholder="Логин"></div>
                                <div class="form-group"><input id="loginPass" type="password" placeholder="Пароль"></div>
                                <button onclick="handleLogin()">Войти</button>
                            </div>
                            <div style="flex:1;">
                                <h3 style="color:var(--gold);">Регистрация</h3>
                                <div class="form-group"><input id="regUser" placeholder="Придумайте логин"></div>
                                <div class="form-group"><input id="regPass" type="password" placeholder="Пароль"></div>
                                <button onclick="handleRegister()">Зарегистрироваться</button>
                            </div>
                        </div>
                    `;
                    window.handleLogin = async () => {
                        const u = document.getElementById('loginUser').value.trim();
                        const p = document.getElementById('loginPass').value;
                        if (u && p) await login(u, p);
                    };
                    window.handleRegister = async () => {
                        const u = document.getElementById('regUser').value.trim();
                        const p = document.getElementById('regPass').value;
                        if (u && p) await register(u, p);
                    };
                    return;
                }

                const roleNames = {
                    user: 'Пользователь',
                    cadet: 'Курсант',
                    staff: 'Сотрудник ВА',
                    deputy_head: 'Зам.Нач.ВА',
                    head: 'Нач.ВА',
                    moderator: 'Модератор'
                };
                let headerHTML = `
                    <div class="header">
                        <div class="emblem"><span class="star">★</span></div>
                        <h1>Военная Академия</h1>
                        <div class="user-bar">
                            <span>👤 ${currentUser.username} (${roleNames[currentUser.role] || currentUser.role})</span>
                            <button onclick="logout()" class="btn-danger" style="padding:6px 16px;">Выйти</button>
                        </div>
                    </div>
                `;

                if (currentUser.role === 'user') {
                    app.innerHTML = headerHTML + `
                        <div class="alert">
                            <strong>Увы, это весь спектр информации который вы можете просматривать</strong><br><br>
                            В случае, если вы не служите в Вооруженных Силах, но имеете таковое желание служить,
                            можете <a href="https://forms.yandex.ru/u/69f3d5e490fa7b19c9a4fe6e/" target="_blank">подать свое заявление в Военный Комиссариат</a>.
                            <br><br>
                            Требования предъявляемые на службу в Вооружённых силах:
                            <ol>
                                <li>Возраст от 18 лет;</li>
                                <li>Иметь прописку от 2 лет (от 2 уровня);</li>
                                <li>Не иметь судимостей;</li>
                            </ol>
                            <br>
                            В случае, если вы служили раннее в Вооруженных Силах но желаете восстановится обратно,
                            можете подать <a href="https://forms.yandex.ru/u/69eef45949af478d8bdd7b7a/" target="_blank">заявление на восстановление</a>.
                            <br><br>
                            Благодарим за ваше внимание!
                        </div>
                    `;
                    return;
                }

                if (currentUser.role === 'cadet') {
                    const forms = await loadForms();
                    const cadetForms = forms.filter(f => f.category === 'cadet' && f.is_active);
                    let tabsHTML = `<button class="nav-tab ${activeTab==='main'?'active':''}" onclick="switchTab('main')">Главная</button>`;
                    cadetForms.forEach(form => {
                        tabsHTML += `<button class="nav-tab ${activeTab===form.id?'active':''}" onclick="switchTab(${form.id})">${form.title}</button>`;
                    });
                    let contentHTML = '';
                    if (activeTab === 'main') {
                        contentHTML = `
                            <h3 style="color:var(--gold);">Информационная панель курсанта</h3>
                            <p>Здесь будет расписание, новости академии (пока заглушка).</p>
                        `;
                    } else {
                        const form = cadetForms.find(f => f.id == activeTab);
                        if (form) {
                            contentHTML = renderFormView(form);
                        } else {
                            contentHTML = '<p>Форма не найдена</p>';
                        }
                    }
                    app.innerHTML = headerHTML + `<div class="nav-tabs">${tabsHTML}</div><div class="tab-content">${contentHTML}</div>`;
                    if (activeTab !== 'main') {
                        const form = cadetForms.find(f => f.id == activeTab);
                        if (form) {
                            window.handleFormSubmit = async () => {
                                const fields = form.fields;
                                const formData = {};
                                fields.forEach(field => {
                                    const el = document.getElementById('field_' + field.label.replace(/\s/g,''));
                                    if (el) formData[field.label] = el.type==='checkbox' ? el.checked : el.value;
                                });
                                await submitForm(form.id, formData);
                            };
                        }
                    }
                    window.switchTab = (tabId) => { activeTab = tabId; render(); };
                    return;
                }

                if (['staff','deputy_head','head'].includes(currentUser.role)) {
                    app.innerHTML = headerHTML + `
                        <div class="alert" style="border-left-color: #4a6b3a;">
                            <h3>Служебный раздел</h3>
                            <p>Информация для ${roleNames[currentUser.role]}. (Функционал будет добавлен позже)</p>
                        </div>
                    `;
                    return;
                }

                if (currentUser.role === 'moderator') {
                    const forms = await loadForms();
                    const { data: users } = await supabase.from('users').select('*').order('id');

                    let formsHTML = '<h3 style="color:var(--gold);">Конструктор форм</h3>';
                    forms.forEach(f => {
                        formsHTML += `
                            <div class="card">
                                <b>${f.title}</b> (${f.category}) [${f.is_active?'Активна':'Выкл'}]
                                <button onclick="toggleFormStatus(${f.id},${f.is_active})" class="btn-danger" style="padding:4px 10px;margin-left:10px;">Перекл</button>
                                <button onclick="deleteForm(${f.id})" class="btn-danger" style="padding:4px 10px;">Удалить</button>
                            </div>`;
                    });
                    formsHTML += `
                        <div class="card">
                            <h4>Создать новую форму</h4>
                            <div class="form-group"><input id="newFormTitle" placeholder="Название формы"></div>
                            <div class="form-group"><input id="newFormDesc" placeholder="Описание"></div>
                            <div class="form-group">
                                <label>Категория</label>
                                <select id="newFormCategory"><option value="cadet">cadet</option><option value="staff">staff</option></select>
                            </div>
                            <div class="form-group"><input id="newFormFields" placeholder='JSON поля, пример: [{"label":"Вопрос","type":"text","required":true}]'></div>
                            <button onclick="handleCreateForm()">Создать</button>
                        </div>
                    `;
                    let usersHTML = '<h3 style="color:var(--gold); margin-top:20px;">Пользователи</h3><table><tr><th>ID</th><th>Логин</th><th>Роль</th><th>Действие</th></tr>';
                    users.forEach(u => {
                        usersHTML += `<tr>
                            <td>${u.id}</td><td>${u.username}</td><td>${u.role}</td>
                            <td>
                                <select id="roleSelect_${u.id}">
                                    <option value="user" ${u.role==='user'?'selected':''}>user</option>
                                    <option value="cadet" ${u.role==='cadet'?'selected':''}>cadet</option>
                                    <option value="staff" ${u.role==='staff'?'selected':''}>staff</option>
                                    <option value="deputy_head" ${u.role==='deputy_head'?'selected':''}>deputy_head</option>
                                    <option value="head" ${u.role==='head'?'selected':''}>head</option>
                                    <option value="moderator" ${u.role==='moderator'?'selected':''}>moderator</option>
                                </select>
                                <button onclick="changeRole(${u.id}, document.getElementById('roleSelect_${u.id}').value)">Сменить</button>
                            </td>
                        </tr>`;
                    });
                    usersHTML += '</table>';
                    app.innerHTML = headerHTML + formsHTML + usersHTML;
                    window.toggleFormStatus = toggleFormStatus;
                    window.deleteForm = deleteForm;
                    window.handleCreateForm = async () => {
                        const title = document.getElementById('newFormTitle').value.trim();
                        const desc = document.getElementById('newFormDesc').value.trim();
                        const category = document.getElementById('newFormCategory').value;
                        let fields = [];
                        try { fields = JSON.parse(document.getElementById('newFormFields').value); } catch(e) { alert('Неверный JSON полей'); return; }
                        await createForm(category, title, desc, fields);
                    };
                    window.changeRole = changeRole;
                    return;
                }
            }

            function renderFormView(form) {
                let html = `<h3>${form.title}</h3><p>${form.description || ''}</p>`;
                form.fields.forEach(f => {
                    const id = 'field_' + f.label.replace(/\s/g, '');
                    html += `<div class="form-group"><label>${f.label}${f.required?' *':''}</label>`;
                    switch(f.type) {
                        case 'text': html += `<input id="${id}" type="text" ${f.required?'required':''}>`; break;
                        case 'date': html += `<input id="${id}" type="date" ${f.required?'required':''}>`; break;
                        case 'time': html += `<input id="${id}" type="time" ${f.required?'required':''}>`; break;
                        case 'textarea': html += `<textarea id="${id}" rows="3" ${f.required?'required':''}></textarea>`; break;
                        case 'select':
                            html += `<select id="${id}" ${f.required?'required':''}>`;
                            (f.options||[]).forEach(opt => html += `<option value="${opt}">${opt}</option>`);
                            html += `</select>`;
                            break;
                        default: html += `<input id="${id}" type="text">`;
                    }
                    html += `</div>`;
                });
                html += `<button onclick="handleFormSubmit()">Отправить запрос</button>`;
                return html;
            }

            // Запуск
            await initApp();
        })();
    </script>
</body>
</html>
