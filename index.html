<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Военная Академия</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        h1 { color: #2563eb; margin-bottom: 10px; }
        .btn { padding: 12px 24px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 380px; width: 90%; }
        .alert { padding: 10px; margin: 10px 0; border-radius: 8px; }
        .alert-error { background: #fee2e2; color: #b91c1c; }
        .alert-success { background: #d1fae5; color: #047857; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎖️ ВОЕННАЯ АКАДЕМИЯ</h1>
        <div id="guestAuth">
            <button class="btn btn-primary" onclick="openModal('registerModal')">📝 Регистрация</button>
            <button class="btn btn-outline" onclick="openModal('loginModal')">🔐 Вход</button>
        </div>
        <div id="userAuth" class="hidden">
            <p>Привет, <strong id="userName"></strong>!</p>
            <button class="btn btn-outline" onclick="handleLogout()">🚪 Выход</button>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2>📝 Регистрация</h2>
            <div id="registerAlert"></div>
            <div class="form-group">
                <label>Username (латиница, цифры, _)</label>
                <input type="text" id="regUsername" placeholder="ivanov123">
            </div>
            <div class="form-group">
                <label>ФИО</label>
                <input type="text" id="regName" placeholder="Иванов Иван">
            </div>
            <div class="form-group">
                <label>Пароль (мин. 6 символов)</label>
                <input type="password" id="regPassword">
            </div>
            <div class="form-group">
                <label>Подтвердите пароль</label>
                <input type="password" id="regPasswordConfirm">
            </div>
            <button class="btn btn-primary" onclick="handleRegister()">Создать</button>
            <button class="btn btn-outline" onclick="closeModal('registerModal')">Отмена</button>
        </div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>🔐 Вход</h2>
            <div id="loginAlert"></div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="ivanov123">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">Войти</button>
            <button class="btn btn-outline" onclick="closeModal('loginModal')">Отмена</button>
        </div>
    </div>

    <script>
        var supabase = window.supabase.createClient('https://innljjhvmyzgfqhenmjq.supabase.co', 'sb_publishable_ViVCLNkbxhKos0sVCWlcOA_eZQEDDO3');

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            var alerts = document.getElementById(id).querySelectorAll('.alert');
            for (var i = 0; i < alerts.length; i++) alerts[i].remove();
        }

        function showAlert(containerId, msg, type) {
            document.getElementById(containerId).innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>';
        }

        function handleRegister() {
            var rawUsername = document.getElementById('regUsername').value.trim();
            var name = document.getElementById('regName').value.trim();
            var password = document.getElementById('regPassword').value;
            var confirm = document.getElementById('regPasswordConfirm').value;

            if (!rawUsername) return showAlert('registerAlert', 'Введите Username', 'error');
            if (!name) return showAlert('registerAlert', 'Введите ФИО', 'error');
            if (!password) return showAlert('registerAlert', 'Введите пароль', 'error');
            if (password !== confirm) return showAlert('registerAlert', 'Пароли не совпадают', 'error');
            if (password.length < 6) return showAlert('registerAlert', 'Пароль минимум 6 символов', 'error');
            
            var username = rawUsername.toLowerCase().replace(/[^a-z0-9_]/g, '');
            if (username.length < 3) return showAlert('registerAlert', 'Username: минимум 3 символа (a-z, 0-9, _)', 'error');

            var fakeEmail = username + '@military-academy.dev';

            supabase.auth.signUp({
                email: fakeEmail,
                password: password,
                options: { data: { username: username, full_name: name } }
            }).then(function(result) {
                if (result.error) {
                    showAlert('registerAlert', result.error.message, 'error');
                } else {
                    showAlert('registerAlert', 'Успешно! Теперь войдите.', 'success');
                    setTimeout(function() {
                        closeModal('registerModal');
                        openModal('loginModal');
                        document.getElementById('loginUsername').value = username;
                    }, 1500);
                }
            });
        }

        function handleLogin() {
            var username = document.getElementById('loginUsername').value.trim().toLowerCase();
            var password = document.getElementById('loginPassword').value;

            if (!username) return showAlert('loginAlert', 'Введите username', 'error');
            if (!password) return showAlert('loginAlert', 'Введите пароль', 'error');

            supabase.from('profiles').select('email').eq('username', username).single()
                .then(function(result) {
                    if (result.error || !result.data) return showAlert('loginAlert', 'Пользователь не найден', 'error');
                    return supabase.auth.signInWithPassword({ email: result.data.email, password: password });
                })
                .then(function(result) {
                    if (result.error) {
                        showAlert('loginAlert', 'Неверный пароль', 'error');
                    } else {
                        closeModal('loginModal');
                        location.reload();
                    }
                });
        }

        function handleLogout() {
            supabase.auth.signOut().then(function() { location.reload(); });
        }

        window.addEventListener('DOMContentLoaded', function() {
            supabase.auth.getSession().then(function(result) {
                if (result.data && result.data.session) {
                    document.getElementById('guestAuth').classList.add('hidden');
                    document.getElementById('userAuth').classList.remove('hidden');
                    var user = result.data.session.user;
                    document.getElementById('userName').textContent = (user.user_metadata && user.user_metadata.username) ? user.user_metadata.username : user.email.split('@')[0];
                }
            });
        });
    </script>
</body>
</html>
