<script>
    // ✅ Твои ключи Supabase
    const SUPABASE_URL = 'https://innljjhvmyzgfqhenmjq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ViVCLNkbxhKos0sVCWlcOA_eZQEDDO3';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let userProfile = null;

    // Создаём частицы на фоне
    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            container.appendChild(particle);
        }
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', async () => {
        createParticles();
        await checkAuth();
        setupTabs();
    });

    // Проверка авторизации
    async function checkAuth() {
        try {
            const {  { session }, error } = await supabase.auth.getSession();
            
            if (error) {
                console.error('Auth error:', error);
                showPublicPage();
                return;
            }
            
            if (session?.user) {
                currentUser = session.user;
                await loadUserProfile();
                showDashboard();
            } else {
                showPublicPage();
            }
        } catch (err) {
            console.error('Check auth error:', err);
            showPublicPage();
        }
    }

    // Загрузка профиля пользователя
    async function loadUserProfile() {
        try {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();
            
            if (error) throw error;
            
            userProfile = data;
            updateUI();
        } catch (err) {
            console.error('Load profile error:', err);
        }
    }

    // Обновление интерфейса под роль
    function updateUI() {
        document.getElementById('userName').textContent = userProfile.full_name || 'Пользователь';
        document.getElementById('userRole').textContent = getRoleName(userProfile.role);
        
        const isCadetOrHigher = ['cadet', 'staff', 'deputy_head', 'head', 'moderator'].includes(userProfile.role);
        document.getElementById('tabLecture').classList.toggle('hidden', !isCadetOrHigher);
        document.getElementById('tabExam').classList.toggle('hidden', !isCadetOrHigher);
        
        loadWelcomeMessage();
    }

    // Красивые названия ролей
    function getRoleName(role) {
        const roles = {
            'user': 'USER',
            'cadet': 'CADET',
            'staff': 'STAFF',
            'deputy_head': 'DEPUTY HEAD',
            'head': 'HEAD',
            'moderator': 'MODERATOR'
        };
        return roles[role] || role;
    }

    // Показать публичную страницу
    function showPublicPage() {
        document.getElementById('guestAuth').classList.remove('hidden');
        document.getElementById('userAuth').classList.add('hidden');
        document.getElementById('publicPage').style.display = 'block';
        document.getElementById('dashboard').classList.remove('active');
    }

    // Показать дашборд
    function showDashboard() {
        document.getElementById('guestAuth').classList.add('hidden');
        document.getElementById('userAuth').classList.remove('hidden');
        document.getElementById('publicPage').style.display = 'none';
        document.getElementById('dashboard').classList.add('active');
    }

    // Логин
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const alertBox = document.getElementById('loginAlert');
        
        if (!email || !password) {
            showAlert(alertBox, '⚠️ Заполните все поля', 'error');
            return;
        }
        
        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) throw error;
            
            closeModal('loginModal');
            await checkAuth();
        } catch (err) {
            showAlert(alertBox, '❌ ' + err.message, 'error');
        }
    }

    // Регистрация
    async function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regPasswordConfirm').value;
        const alertBox = document.getElementById('registerAlert');
        
        if (!name || !email || !password) {
            showAlert(alertBox, '⚠️ Заполните все обязательные поля', 'error');
            return;
        }
        
        if (password !== confirm) {
            showAlert(alertBox, '❌ Пароли не совпадают', 'error');
            return;
        }
        
        if (password.length < 6) {
            showAlert(alertBox, '❌ Пароль должен содержать минимум 6 символов', 'error');
            return;
        }
        
        try {
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { full_name: name } }
            });
            
            if (error) throw error;
            
            showAlert(alertBox, '✅ Регистрация успешна! Теперь войдите.', 'success');
            
            setTimeout(() => {
                closeModal('registerModal');
                openModal('loginModal');
            }, 2000);
        } catch (err) {
            showAlert(alertBox, '❌ ' + err.message, 'error');
        }
    }

    // Выход
    async function logout() {
        await supabase.auth.signOut();
        currentUser = null;
        userProfile = null;
        showPublicPage();
    }

    // Вкладки
    function setupTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
            });
        });
    }

    // Приветственное сообщение
    function loadWelcomeMessage() {
        const msg = document.getElementById('welcomeMessage');
        const role = userProfile.role;
        const name = userProfile.full_name?.split(' ')[0] || 'Коллега';
        
        const messages = {
            'cadet': `Добро пожаловать, курсант <strong style="color: var(--accent-gold)">${name}</strong>! 🎓<br><br>Вы можете подавать запросы на лекции и экзамены через соответствующие вкладки.`,
            'staff': `Здравствуйте, <strong style="color: var(--accent-gold)">${name}</strong>! 👨‍💼<br><br>Вы имеете доступ к просмотру и обработке запросов курсантов.`,
            'deputy_head': `Приветствуем, Заместитель Начальника <strong style="color: var(--accent-gold)">${name}</strong>! ⭐<br><br>Вам доступен полный функционал управления Академией.`,
            'head': `Добро пожаловать, Начальник <strong style="color: var(--accent-gold)">${name}</strong>! 🎖️<br><br>Вам доступен полный контроль над системой.`,
            'moderator': `Здравствуйте, Модератор <strong style="color: var(--accent-gold)">${name}</strong>! ⚙️<br><br>Вы можете создавать и управлять формами.`
        };
        
        msg.innerHTML = messages[role] || `Добро пожаловать, <strong style="color: var(--accent-gold)">${name}</strong>!`;
    }

    // Модальные окна
    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
        document.querySelectorAll(`#${id} input`).forEach(i => i.value = '');
        document.querySelectorAll(`#${id} .alert`).forEach(a => a.remove());
    }

    function switchModal(from, to) {
        closeModal(from);
        openModal(to);
    }

    function showAlert(container, message, type) {
        container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    // Подписка на изменения авторизации
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN') {
            currentUser = session.user;
            loadUserProfile();
            showDashboard();
        } else if (event === 'SIGNED_OUT') {
            currentUser = null;
            userProfile = null;
            showPublicPage();
        }
    });
</script>
