<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Военная Академия</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 50px auto; background: white; padding: 25px; border-radius: 10px; }
        h1 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 10px 0; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0052a3; }
        .alert { padding: 10px; margin: 10px 0; border-radius: 6px; text-align: center; }
        .error { background: #ffe0e0; color: #c00; }
        .success { background: #e0ffe0; color: #090; }
        .hidden { display: none; }
        .link { text-align: center; margin-top: 15px; color: #0066cc; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎖️ ВОЕННАЯ АКАДЕМИЯ</h1>
        
        <!-- Гостевой экран -->
        <div id="guestView">
            <button onclick="showRegister()">📝 Регистрация</button>
            <button onclick="showLogin()" style="background:#666">🔐 Вход</button>
        </div>

        <!-- Регистрация -->
        <div id="registerView" class="hidden">
            <input type="text" id="regName" placeholder="ФИО (например: Швец О.В.)">
            <input type="password" id="regPass" placeholder="Пароль">
            <input type="password" id="regPass2" placeholder="Повторите пароль">
            <button onclick="doRegister()">Создать аккаунт</button>
            <button onclick="showGuest()" style="background:#999">Назад</button>
            <div id="regMsg"></div>
        </div>

        <!-- Вход -->
        <div id="loginView" class="hidden">
            <input type="text" id="loginName" placeholder="ФИО">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button onclick="doLogin()">Войти</button>
            <button onclick="showGuest()" style="background:#999">Назад</button>
            <div id="loginMsg"></div>
        </div>

        <!-- Личный кабинет -->
        <div id="userView" class="hidden">
            <p style="text-align:center">Привет, <strong id="userName"></strong>!</p>
            <button onclick="doLogout()">🚪 Выйти</button>
        </div>
    </div>

    <script>
        // Supabase (email скрыт от пользователя)
        var sb = window.supabase.createClient('https://innljjhvmyzgfqhenmjq.supabase.co', 'sb_publishable_ViVCLNkbxhKos0sVCWlcOA_eZQEDDO3');

        // Переключение экранов
        function showGuest() { hideAll(); document.getElementById('guestView').classList.remove('hidden'); }
        function showRegister() { hideAll(); document.getElementById('registerView').classList.remove('hidden'); }
        function showLogin() { hideAll(); document.getElementById('loginView').classList.remove('hidden'); }
        function showUser(name) { hideAll(); document.getElementById('userName').textContent = name; document.getElementById('userView').classList.remove('hidden'); }
        function hideAll() { ['guestView','registerView','loginView','userView'].forEach(id => document.getElementById(id).classList.add('hidden')); }

        function msg(id, text, type) { document.getElementById(id).innerHTML = '<div class="alert ' + type + '">' + text + '</div>'; }

        // РЕГИСТРАЦИЯ (только ФИО + пароль)
        function doRegister() {
            var name = document.getElementById('regName').value.trim();
            var p1 = document.getElementById('regPass').value;
            var p2 = document.getElementById('regPass2').value;
            
            if (!name) return msg('regMsg', 'Введите ФИО', 'error');
            if (!p1) return msg('regMsg', 'Введите пароль', 'error');
            if (p1 !== p2) return msg('regMsg', 'Пароли не совпадают', 'error');
            if (p1.length < 6) return msg('regMsg', 'Пароль минимум 6 символов', 'error');

            // ✅ ИСПРАВЛЕНИЕ: Генерируем случайный валидный email, чтобы избежать ошибок с кириллицей
            var techEmail = Math.random().toString(36).substring(2, 10) + "@a.dev";

            sb.auth.signUp({
                email: techEmail,
                password: p1,
                options: {  { full_name: name } }
            }).then(function(r) {
                if (r.error) msg('regMsg', r.error.message, 'error');
                else { msg('regMsg', '✅ Готово! Войдите.', 'success'); setTimeout(showLogin, 1500); }
            });
        }

        // ВХОД (по ФИО)
        function doLogin() {
            var name = document.getElementById('loginName').value.trim();
            var pass = document.getElementById('loginPass').value;
            
            if (!name) return msg('loginMsg', 'Введите ФИО', 'error');
            if (!pass) return msg('loginMsg', 'Введите пароль', 'error');

            // Ищем пользователя по ФИО в профилях
            sb.from('profiles').select('email').eq('full_name', name).single()
                .then(function(r) {
                    if (r.error || !r.data) return msg('loginMsg', 'Не найдено', 'error');
                    // Входим по найденному техническому email
                    return sb.auth.signInWithPassword({ email: r.data.email, password: pass });
                })
                .then(function(r) {
                    if (r.error) msg('loginMsg', 'Неверный пароль', 'error');
                    else { showUser(name); }
                });
        }

        // ВЫХОД
        function doLogout() { sb.auth.signOut().then(showGuest); }

        // Проверка сессии при загрузке
        window.addEventListener('DOMContentLoaded', function() {
            sb.auth.getSession().then(function(r) {
                if (r.data.session) {
                    var nm = r.data.session.user.user_metadata.full_name || 'Пользователь';
                    showUser(nm);
                }
            });
        });
    </script>
</body>
</html>
