<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Военная Академия</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  background:#0d1117;
  color:#e6edf3;
  font-family:Arial;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.box {
  background:#161b22;
  padding:30px;
  border-radius:12px;
  width:320px;
}

input {
  width:100%;
  padding:10px;
  margin:8px 0;
  background:#1c2333;
  border:1px solid #30363d;
  color:white;
}

button {
  width:100%;
  padding:10px;
  background:#c9a84c;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.switch {
  margin-top:10px;
  text-align:center;
  cursor:pointer;
  color:#c9a84c;
}

.msg {
  margin:10px 0;
  font-size:14px;
}
</style>
</head>
<body>

<div class="box">

<h2 id="title">Вход</h2>

<div id="msg" class="msg"></div>

<!-- LOGIN -->
<form id="loginForm">
<input id="loginUser" placeholder="Логин" required>
<input id="loginPass" type="password" placeholder="Пароль" required>
<button>Войти</button>
</form>

<!-- REGISTER -->
<form id="registerForm" style="display:none;">
<input id="regUser" placeholder="Логин" required>
<input id="regPass" type="password" placeholder="Пароль" required>
<input id="regPass2" type="password" placeholder="Повторите пароль" required>
<button>Создать аккаунт</button>
</form>

<div id="switch" class="switch">Нет аккаунта? Регистрация</div>

</div>

<script>
const sb = supabase.createClient(
  "https://uhdqwfgekbajtkoiseem.supabase.co",
  "sb_publishable_jJC6GT7TcL9tru2l4ksBhw_gYbOTjkj"
);

const msg = document.getElementById("msg");

function show(m, ok=false){
  msg.style.color = ok ? "#2ea043" : "#f85149";
  msg.textContent = m;
}

async function hash(p){
  const buf = new TextEncoder().encode(p);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash))
    .map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ================= LOGIN ================= */
document.getElementById("loginForm").onsubmit = async e=>{
  e.preventDefault();

  const u = loginUser.value.trim();
  const p = await hash(loginPass.value);

  const {data,error} = await sb
    .from("users")
    .select("*")
    .eq("username",u)
    .eq("password_hash",p)
    .single();

  if(!data) return show("Неверный логин или пароль");

  show("Вход выполнен", true);
  localStorage.setItem("user", JSON.stringify(data));

  setTimeout(()=>location.reload(),500);
};

/* ================= REGISTER ================= */
document.getElementById("registerForm").onsubmit = async e=>{
  e.preventDefault();

  const u = regUser.value.trim();
  const p1 = regPass.value;
  const p2 = regPass2.value;

  if(p1 !== p2) return show("Пароли не совпадают");
  if(p1.length < 6) return show("Пароль минимум 6 символов");

  const hashPwd = await hash(p1);

  const exists = await sb.from("users")
    .select("id")
    .eq("username",u)
    .single();

  if(exists.data) return show("Логин занят");

  const {error} = await sb.from("users").insert([{
    username:u,
    password_hash:hashPwd,
    role:"user"
  }]);

  if(error) return show(error.message);

  show("Аккаунт создан!", true);

  setTimeout(()=>{
    switchMode(true);
  },800);
};

/* ================= SWITCH ================= */
const loginForm = document.getElementById("loginForm");
const regForm = document.getElementById("registerForm");
const switchBtn = document.getElementById("switch");
const title = document.getElementById("title");

let loginMode = true;

function switchMode(toLogin=false){
  loginMode = toLogin;
  loginForm.style.display = loginMode ? "block":"none";
  regForm.style.display = loginMode ? "none":"block";
  title.textContent = loginMode ? "Вход":"Регистрация";
  switchBtn.textContent = loginMode
    ? "Нет аккаунта? Регистрация"
    : "Уже есть аккаунт? Войти";
  msg.textContent="";
}

switchBtn.onclick = ()=>switchMode(!loginMode);

/* ================= AUTO LOGIN ================= */
const user = JSON.parse(localStorage.getItem("user"));
if(user){
  document.body.innerHTML = `
    <div style="text-align:center">
      <h2>Добро пожаловать, ${user.username}</h2>
      <button onclick="logout()">Выйти</button>
    </div>
  `;
}

function logout(){
  localStorage.removeItem("user");
  location.reload();
}
</script>

</body>
</html>
