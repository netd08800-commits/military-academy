<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Военная Академия</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0d1117;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#161b22;
  padding:30px;
  border-radius:10px;
  width:320px;
}

input{
  width:100%;
  margin:5px 0;
  padding:10px;
  background:#1c2333;
  border:1px solid #30363d;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#c9a84c;
  border:none;
  cursor:pointer;
}

.switch{
  text-align:center;
  margin-top:10px;
  cursor:pointer;
  color:#c9a84c;
}
</style>
</head>

<body>

<div class="box">

<h2 id="title">Вход</h2>

<form id="login">
<input id="luser" placeholder="Логин">
<input id="lpass" type="password" placeholder="Пароль">
<button>Войти</button>
</form>

<form id="reg" style="display:none;">
<input id="ruser" placeholder="Логин">
<input id="rpass" type="password" placeholder="Пароль">
<input id="rpass2" type="password" placeholder="Повтор">
<button>Регистрация</button>
</form>

<div id="switch" class="switch">Регистрация</div>

</div>

<script>
const sb = supabase.createClient(
"https://innljjhvmyzgfqhenmjq.supabase.co",
"sb_publishable_ViVCLNkbxhKos0sVCWlcOA_eZQEDDO3"
);

/* hash */
async function hash(p){
  const b=new TextEncoder().encode(p);
  const h=await crypto.subtle.digest("SHA-256",b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* переключение */
let mode=0;
switch.onclick=()=>{
  mode=!mode;
  login.style.display=mode?"none":"block";
  reg.style.display=mode?"block":"none";
  title.innerText=mode?"Регистрация":"Вход";
};

/* регистрация */
reg.onsubmit=async e=>{
  e.preventDefault();

  if(rpass.value!==rpass2.value){
    alert("Пароли не совпадают");
    return;
  }

  let h=await hash(rpass.value);

  let {data:exists} = await sb
    .from("users")
    .select("id")
    .eq("username", ruser.value)
    .single();

  if(exists){
    alert("Логин уже есть");
    return;
  }

  let {error} = await sb.from("users").insert([{
    username:ruser.value,
    password_hash:h,
    role:"user"
  }]);

  if(error){
    alert(error.message);
    return;
  }

  alert("Создано");
};

/* вход */
login.onsubmit=async e=>{
  e.preventDefault();

  let h=await hash(lpass.value);

  let {data} = await sb.from("users")
    .select("*")
    .eq("username", luser.value)
    .eq("password_hash", h)
    .single();

  if(!data){
    alert("Ошибка входа");
    return;
  }

  localStorage.user=JSON.stringify(data);
  alert("Вход выполнен");
};
</script>

</body>
</html>
