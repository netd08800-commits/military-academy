<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Военная Академия</title>
  <style>
    :root {
      --bg: #0b1a2f;
      --panel: #132438;
      --gold: #c9a84c;
      --text: #e0e8f0;
      --accent: #2c5f8a;
      --danger: #8a2c2c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: radial-gradient(circle at 20% 30%, #1a2d47 0%, #0b1a2f 90%);
    }
    .container {
      background: var(--panel);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: fadeSlide 0.5s ease;
      border: 1px solid #2e405b;
      position: relative;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1, h2, h3 { color: var(--gold); margin-bottom: 20px; text-align: center; }
    .logo { font-size: 24px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 20px; }
    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      background: #1e2e42;
      border: 1px solid #3a5068;
      border-radius: 6px;
      color: var(--text);
      font-size: 16px;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--gold); outline: none; }
    button {
      background: var(--gold);
      color: #0b1a2f;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover { background: #dbb550; transform: translateY(-2px); }
    button.secondary { background: var(--accent); color: white; }
    button.danger { background: var(--danger); }
    .nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #2e405b;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }
    .nav button {
      width: auto;
      padding: 8px 20px;
      background: transparent;
      color: var(--text);
      border: 1px solid #3a5068;
    }
    .nav button.active { background: var(--gold); color:#0b1a2f; border-color: var(--gold); }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 10px; }
    label { font-weight: bold; display: block; margin-bottom: 4px; }
    .info-block { background: #0f1e2d; padding: 15px; border-radius: 8px; border-left: 4px solid var(--gold); margin: 10px 0; }
    a { color: var(--gold); text-decoration: underline; }
    .logout-btn { position: absolute; top: 20px; right: 20px; background: var(--danger); width: auto; padding: 8px 16px; z-index: 10; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { background: #0f1e2d; padding: 15px; border-radius: 8px; margin-bottom: 10px; flex: 1; min-width: 200px; }
    .roleSelect { width: auto; padding: 5px; margin-top: 5px; background: #1e2e42; color: var(--text); border:1px solid #3a5068; border-radius:4px; }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://innljjhvmyzgfqhenmjq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ViVCLNkbxhKos0sVCWlcOA_eZQEDDO3';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

    function saveUser(user) { localStorage.setItem('currentUser', JSON.stringify(user)); currentUser = user; }
    function logout() { localStorage.removeItem('currentUser'); currentUser = null; render(); }

    function render() {
      const app = document.getElementById('app');
      if (!currentUser) {
        app.innerHTML = loginHTML();
        attachLoginEvents();
      } else {
        switch(currentUser.role) {
          case 'user': app.innerHTML = userDashboard(); break;
          case 'coursant': app.innerHTML = cadetDashboard(); attachCadetEvents(); break;
          case 'officer':
          case 'deputy':
          case 'head': app.innerHTML = officerDashboard(); break;
          case 'moderator': app.innerHTML = moderatorDashboard(); attachModeratorEvents(); break;
          default: logout(); return;
        }
        const logoutBtn = document.querySelector('.logout-btn');
        if (logoutBtn) logoutBtn.addEventListener('click', logout);
      }
    }

    function loginHTML() {
      return `
        <div class="logo">⚔️ Военная Академия</div>
        <h2>Вход / Регистрация</h2>
        <div id="loginForm">
          <input id="username" placeholder="Позывной (логин)" autocomplete="off">
          <input id="password" type="password" placeholder="Пароль">
          <button id="loginBtn">Войти</button>
          <button id="toRegisterBtn" class="secondary">Зарегистрироваться</button>
        </div>
        <div id="registerForm" class="hidden">
          <input id="regUsername" placeholder="Придумайте позывной">
          <input id="regPassword" type="password" placeholder="Пароль (мин. 4 символа)">
          <input id="regConfirm" type="password" placeholder="Повторите пароль">
          <button id="registerBtn">Создать аккаунт</button>
          <button id="toLoginBtn" class="secondary">← Назад</button>
        </div>
        <div id="msg" style="color:#ff8888; margin-top:10px; text-align:center;"></div>
      `;
    }

    function attachLoginEvents() {
      document.getElementById('loginBtn').addEventListener('click', login);
      document.getElementById('toRegisterBtn').addEventListener('click', () => {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('msg').textContent = '';
      });
      document.getElementById('toLoginBtn').addEventListener('click', () => {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('msg').textContent = '';
      });
      document.getElementById('registerBtn').addEventListener('click', register);
    }

    async function login() {
      const uname = document.getElementById('username').value.trim();
      const pwd = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      if (!uname || !pwd) { msg.textContent = 'Заполните все поля'; return; }
      const { data, error } = await supabase.rpc('authenticate_user', { uname, pwd });
      if (error || !data || data.length === 0) {
        msg.textContent = 'Неверный позывной или пароль';
        return;
      }
      saveUser(data[0]);
      render();
    }

    async function register() {
      const uname = document.getElementById('regUsername').value.trim();
      const pwd = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      const msg = document.getElementById('msg');
      if (!uname || pwd.length < 4) { msg.textContent = 'Позывной и пароль (мин. 4 симв.) обязательны'; return; }
      if (pwd !== confirm) { msg.textContent = 'Пароли не совпадают'; return; }
      const { data, error } = await supabase.rpc('register_user', { uname, pwd });
      if (error) { msg.textContent = 'Ошибка: возможно, такой позывной уже занят.'; return; }
      const { data: authData } = await supabase.rpc('authenticate_user', { uname, pwd });
      if (authData && authData.length) { saveUser(authData[0]); render(); }
    }

    function userDashboard() {
      return `
        <button class="logout-btn">Выйти</button>
        <div class="logo">⚔️ Военная Академия</div>
        <h2>Информация для посетителей</h2>
        <div class="info-block">
          <p>Увы, это весь спектр информации, который вы можете просматривать.</p>
          <p>В случае, если вы не служите в Вооруженных Силах, но имеете таковое желание служить, можете 
          <a href="https://forms.yandex.ru/u/69f3d5e490fa7b19c9a4fe6e/" target="_blank">подать свое заявление в Военный Комиссариат</a>.</p>
          <h3>Требования предъявляемые на службу в Вооружённых силах:</h3>
          <ol>
            <li>Возраст от 18 лет;</li>
            <li>Иметь прописку от 2 лет (от 2 уровня);</li>
            <li>Не иметь судимостей;</li>
          </ol>
          <p>В случае, если вы служили ранее в Вооруженных Силах, но желаете восстановиться обратно, можете 
          <a href="https://forms.yandex.ru/u/69eef45949af478d8bdd7b7a/" target="_blank">подать заявление на восстановление</a>.</p>
          <p style="margin-top:15px;">Благодарим за ваше внимание!</p>
        </div>
      `;
    }

    function cadetDashboard() {
      return `
        <button class="logout-btn">Выйти</button>
        <div class="logo">🎓 Курсант Военной Академии</div>
        <div class="nav" id="cadetNav">
          <button class="active" data-view="home">Главная</button>
          <button data-view="lecture">Запрос на Лекцию</button>
          <button data-view="exam">Запрос на Экзамен</button>
        </div>
        <div id="cadetContent">
          <div id="cadetHome" class="view">
            <h3>Добро пожаловать, курсант ${currentUser.username}!</h3>
            <div class="info-block">
              <p>Вы находитесь в личном кабинете курсанта Военной Академии.</p>
              <p>В меню выберите нужный запрос. Все формы созданы модератором.</p>
            </div>
          </div>
          <div id="cadetLecture" class="view hidden">
            <h3>Запрос на Лекцию</h3>
            <div id="lectureFormsContainer">Загрузка форм...</div>
          </div>
          <div id="cadetExam" class="view hidden">
            <h3>Запрос на Экзамен</h3>
            <div id="examFormsContainer">Загрузка форм...</div>
          </div>
        </div>
      `;
    }

    function attachCadetEvents() {
      const nav = document.getElementById('cadetNav');
      nav.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
          nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const view = this.dataset.view;
          document.querySelectorAll('#cadetContent .view').forEach(v => v.classList.add('hidden'));
          document.getElementById(`cadet${view.charAt(0).toUpperCase() + view.slice(1)}`).classList.remove('hidden');
          if (view === 'lecture') loadFormsForCadet('lectureFormsContainer', 'Запрос на лекцию');
          if (view === 'exam') loadFormsForCadet('examFormsContainer', 'Запрос на экзамен');
        });
      });
    }

    async function loadFormsForCadet(containerId, formTitle) {
      const container = document.getElementById(containerId);
      const { data: forms } = await supabase.from('forms').select('*').ilike('title', `%${formTitle}%`);
      if (!forms || forms.length === 0) { container.innerHTML = '<p>Нет доступных форм.</p>'; return; }
      let html = '';
      for (const form of forms) {
        const { data: fields } = await supabase.from('form_fields').select('*').eq('form_id', form.id);
        html += `<div class="card"><h4>${form.title}</h4><p>${form.description || ''}</p>`;
        html += '<form class="submitForm" data-form-id="'+form.id+'">';
        if (fields) {
          fields.forEach(f => {
            html += `<div class="form-group"><label>${f.field_label} ${f.required ? '*' : ''}</label>`;
            if (f.field_type === 'textarea') html += `<textarea name="field_${f.id}" ${f.required ? 'required' : ''}></textarea>`;
            else if (f.field_type === 'select') {
              const opts = JSON.parse(f.options || '[]');
              html += `<select name="field_${f.id}"><option value="">-- Выберите --</option>`;
              opts.forEach(o => html += `<option value="${o}">${o}</option>`);
              html += `</select>`;
            } else html += `<input type="${f.field_type}" name="field_${f.id}" ${f.required ? 'required' : ''}>`;
            html += `</div>`;
          });
        }
        html += '<button type="submit">Отправить запрос</button></form></div>';
      }
      container.innerHTML = html;
      container.querySelectorAll('.submitForm').forEach(formEl => {
        formEl.addEventListener('submit', async (e) => {
          e.preventDefault();
          const formId = formEl.dataset.formId;
          const formData = new FormData(formEl);
          const { data: sub, error: subErr } = await supabase.from('form_submissions').insert({
            form_id: formId, user_id: currentUser.id
          }).select().single();
          if (subErr) { alert('Ошибка: '+subErr.message); return; }
          const answers = [];
          for (let [name, value] of formData.entries()) {
            const fieldId = parseInt(name.split('_')[1]);
            answers.push({ submission_id: sub.id, field_id: fieldId, answer: value });
          }
          const { error: ansErr } = await supabase.from('form_answers').insert(answers);
          if (ansErr) alert('Ошибка сохранения ответов');
          else { alert('Запрос отправлен!'); formEl.reset(); }
        });
      });
    }

    function officerDashboard() {
      return `<button class="logout-btn">Выйти</button><div class="logo">🎖️ Панель офицера</div><p style="text-align:center;">Кабинет офицера (в разработке)</p>`;
    }

    function moderatorDashboard() {
      return `
        <button class="logout-btn">Выйти</button>
        <div class="logo">🛡️ Панель Модератора</div>
        <div class="nav" id="modNav">
          <button class="active" data-view="forms">Управление формами</button>
          <button data-view="users">Пользователи</button>
        </div>
        <div id="modContent">
          <div id="modForms"></div>
          <div id="modUsers" class="hidden"></div>
        </div>
      `;
    }

    function attachModeratorEvents() {
      document.querySelectorAll('#modNav button').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('#modNav button').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const view = this.dataset.view;
          document.getElementById('modForms').classList.add('hidden');
          document.getElementById('modUsers').classList.add('hidden');
          if (view === 'forms') {
            document.getElementById('modForms').classList.remove('hidden');
            loadModeratorForms();
          } else {
            document.getElementById('modUsers').classList.remove('hidden');
            loadUserList();
          }
        });
      });
      loadModeratorForms();
    }

    async function loadModeratorForms() {
      const container = document.getElementById('modForms');
      const { data: forms } = await supabase.from('forms').select('*');
      let html = '<h3>Создание / Редактирование форм</h3>';
      html += `<button id="newFormBtn" class="secondary">+ Новая форма</button><br><br>`;
      if (forms) {
        forms.forEach(f => {
          html += `<div class="card"><b>${f.title}</b> <button class="danger" data-delform="${f.id}" style="width:auto; float:right;">Удалить</button><br>
            <small>${f.description || ''}</small>
            <button class="secondary editFieldsBtn" data-formid="${f.id}" style="margin-top:5px;">Редактировать поля</button>
          </div>`;
        });
      }
      container.innerHTML = html;
      document.getElementById('newFormBtn').addEventListener('click', () => showFormEditor());
      document.querySelectorAll('[data-delform]').forEach(b => b.addEventListener('click', async (e) => {
        const id = e.target.dataset.delform;
        await supabase.from('forms').delete().eq('id', id);
        loadModeratorForms();
      }));
      document.querySelectorAll('.editFieldsBtn').forEach(b => b.addEventListener('click', (e) => {
        showFieldEditor(e.target.dataset.formid);
      }));
    }

    function showFormEditor(form = null) {
      const container = document.getElementById('modForms');
      container.innerHTML = `
        <h3>${form ? 'Редактировать форму' : 'Новая форма'}</h3>
        <input id="formTitle" placeholder="Название формы" value="${form ? form.title : ''}">
        <textarea id="formDesc" placeholder="Описание">${form ? form.description : ''}</textarea>
        <button id="saveFormBtn">Сохранить</button>
        <button id="cancelFormBtn" class="secondary">Отмена</button>
      `;
      document.getElementById('saveFormBtn').addEventListener('click', async () => {
        const title = document.getElementById('formTitle').value;
        const desc = document.getElementById('formDesc').value;
        if (!title) { alert('Введите название'); return; }
        if (form) {
          await supabase.from('forms').update({ title, description: desc }).eq('id', form.id);
        } else {
          await supabase.from('forms').insert({ title, description: desc, created_by: currentUser.id });
        }
        loadModeratorForms();
      });
      document.getElementById('cancelFormBtn').addEventListener('click', loadModeratorForms);
    }

    async function showFieldEditor(formId) {
      const { data: form } = await supabase.from('forms').select('*').eq('id', formId).single();
      const { data: fields } = await supabase.from('form_fields').select('*').eq('form_id', formId);
      const container = document.getElementById('modForms');
      let html = `<h3>Поля формы "${form.title}"</h3>
        <button id="addFieldBtn" class="secondary">+ Добавить поле</button>
        <button id="backToFormsBtn" class="secondary">← К списку форм</button>
        <div id="fieldsList">`;
      if (fields) {
        fields.forEach(f => {
          html += `<div class="card">
            <b>${f.field_label}</b> (${f.field_type}) ${f.required ? '*' : ''}
            <button class="danger delFieldBtn" data-fieldid="${f.id}" style="width:auto; float:right;">🗑️</button>
          </div>`;
        });
      }
      html += `</div><div id="fieldEditor"></div>`;
      container.innerHTML = html;
      document.getElementById('backToFormsBtn').addEventListener('click', loadModeratorForms);
      document.getElementById('addFieldBtn').addEventListener('click', () => {
        document.getElementById('fieldEditor').innerHTML = `
          <h4>Новое поле</h4>
          <input id="fieldLabel" placeholder="Название поля">
          <select id="fieldType">
            <option value="text">Текст</option>
            <option value="textarea">Многострочный</option>
            <option value="select">Выпадающий список</option>
            <option value="checkbox">Галочка</option>
          </select>
          <label><input type="checkbox" id="fieldRequired" checked> Обязательное</label>
          <div id="optionsContainer" class="hidden">
            <input id="fieldOptions" placeholder="Варианты через запятую">
          </div>
          <button id="saveFieldBtn">Добавить поле</button>
        `;
        document.getElementById('fieldType').addEventListener('change', function() {
          document.getElementById('optionsContainer').classList.toggle('hidden', this.value !== 'select');
        });
        document.getElementById('saveFieldBtn').addEventListener('click', async () => {
          const label = document.getElementById('fieldLabel').value;
          const type = document.getElementById('fieldType').value;
          const required = document.getElementById('fieldRequired').checked;
          const optionsStr = document.getElementById('fieldOptions').value;
          let options = [];
          if (type === 'select' && optionsStr) options = optionsStr.split(',').map(s => s.trim());
          if (!label) { alert('Введите название поля'); return; }
          await supabase.from('form_fields').insert({
            form_id: formId, field_label: label, field_type: type, required,
            options: JSON.stringify(options)
          });
          showFieldEditor(formId);
        });
      });
      document.querySelectorAll('.delFieldBtn').forEach(b => b.addEventListener('click', async (e) => {
        const id = e.target.dataset.fieldid;
        await supabase.from('form_fields').delete().eq('id', id);
        showFieldEditor(formId);
      }));
    }

    async function loadUserList() {
      const container = document.getElementById('modUsers');
      const { data: users, error } = await supabase.rpc('get_all_users');
      if (error) { container.innerHTML = '<p>Ошибка загрузки пользователей</p>'; return; }
      let html = '<h3>Список пользователей</h3><div class="row">';
      users.forEach(u => {
        html += `<div class="card" style="flex:1; min-width:200px;">
          <b>${u.username}</b> (${u.role})
          <select class="roleSelect" data-userid="${u.id}">
            <option value="user" ${u.role==='user'?'selected':''}>user</option>
            <option value="coursant" ${u.role==='coursant'?'selected':''}>coursant</option>
            <option value="officer" ${u.role==='officer'?'selected':''}>officer</option>
            <option value="deputy" ${u.role==='deputy'?'selected':''}>deputy</option>
            <option value="head" ${u.role==='head'?'selected':''}>head</option>
            <option value="moderator" ${u.role==='moderator'?'selected':''}>moderator</option>
          </select>
        </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
      document.querySelectorAll('.roleSelect').forEach(sel => {
        sel.addEventListener('change', async (e) => {
          const userId = e.target.dataset.userid;
          const newRole = e.target.value;
          await supabase.rpc('update_user_role', { uid: userId, new_role: new_role });
          alert('Роль обновлена');
        });
      });
    }

    render();
  </script>
</body>
</html>
